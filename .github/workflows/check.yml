# Is each Everwright site up? Runs on GitHub's machines, so it still works when the server, Oracle
# or the Mac is down. One issue per outage (labelled "down"): opened when a site stops answering,
# closed when it answers again, so an outage sends two emails rather than one every five minutes.
name: check
on:
  schedule:
    - cron: "*/5 * * * *"
    # GitHub turns off a public repo's schedules after 60 days without a commit.
    - cron: "17 3 1 * *"
  workflow_dispatch:
    inputs:
      sites:
        description: "Addresses to check instead of SITES (to test the alarm)"
        required: false
permissions:
  contents: write
  issues: write
jobs:
  sites:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      # Down means the sign-in page does not answer. /health is reported but does not alert:
      # it also turns "degraded" when one board out of a thousand fails to refresh.
      SITES: ${{ inputs.sites || 'https://jobfinder.everwrightlabs.com/login' }}
    steps:
      - name: check
        run: |
          problems=""
          for url in $SITES; do
            code=""
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)
              [ "$code" = 200 ] && break
              sleep 20
            done
            [ "$code" = 200 ] && echo "up   $url" || { echo "DOWN $url ($code)"; problems="$problems- $url answered ${code:-nothing} three times"$'\n'; }
          done
          health=$(curl -s --max-time 20 https://jobfinder.everwrightlabs.com/health | head -c 1500 || true)
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label down --state open --json number --jq '.[0].number // empty')
          if [ -n "$problems" ] && [ -z "$open" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --label down --title "Down: $(echo "$problems" | head -1 | cut -c3-60)" \
              --body "$(printf 'Checked %s UTC from GitHub.\n\n%s\n/health said:\n```\n%s\n```\n' "$(date -u '+%F %T')" "$problems" "$health")"
          elif [ -z "$problems" ] && [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "Answering again at $(date -u '+%F %T') UTC."
          fi
  keepalive:
    if: github.event.schedule == '17 3 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%F > last-checked-in
          git config user.name "uptime"; git config user.email "uptime@users.noreply.github.com"
          git add last-checked-in && git commit -qm "Monthly check-in, keeps the schedule on" && git push
